---
version: 0.2.0
slug: speech-to-phrase
name: Speech-to-Phrase
description: Constrained Wyoming speech-to-text for Home Assistant
url: https://github.com/OHF-Voice/apps/tree/main/speech-to-phrase
arch:
  - amd64
  - aarch64
init: false
discovery:
  - wyoming
homeassistant_api: true
ingress: true
ingress_port: 8099
ports:
  "10300/tcp": null
options:
  language: "en"
  backend: "auto"
  default_importance: "usable"
  sentence_triggers: true
  question_answers: true
  debug_logging: false
schema:
  language: str
  backend: "list(auto|citrinet|coqui)"
  default_importance: "list(required|usable|complete|optional)"
  # Add the phrases Home Assistant is already listening for to the grammar:
  # automation sentence triggers, and assist_satellite.ask_question answers.
  # Both widen the grammar, and the answer crawl reads every automation/script
  # config, so either can be switched off.
  sentence_triggers: bool
  question_answers: bool
  # Score gate. Left unset by default so a per-backend default applies
  # (citrinet 5.0, coqui 2.0); set it here to override for all languages.
  max_score: "float?"
  # Word-insertion reward per emitted token. Left unset so a per-backend default
  # applies (citrinet 2.0, coqui 0.0); set it to 0 to disable, or higher if long
  # commands are still decoded as shorter in-grammar phrases.
  token_bonus: "float?"
  debug_logging: bool
homeassistant: 2026.3.0
