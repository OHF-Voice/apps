---
version: 0.2.0
slug: speech-to-phrase
name: Speech-to-Phrase
description: Constrained Wyoming speech-to-text for Home Assistant
url: https://github.com/OHF-Voice/apps/tree/main/speech-to-phrase
arch:
  - amd64
  - aarch64
init: false
discovery:
  - wyoming
homeassistant_api: true
ingress: true
ingress_port: 8099
ports:
  "10300/tcp": null
map:
  - share:rw
options:
  language: "en"
  backend: "auto"
  default_importance: "usable"
  debug_logging: false
schema:
  language: str
  backend: "list(auto|citrinet|coqui)"
  default_importance: "list(required|usable|complete|optional)"
  # Score gate. Left unset by default so a per-backend default applies
  # (citrinet 5.0, coqui 2.0); set it here to override for all languages.
  max_score: "float?"
  # Word-insertion reward per emitted token. Raise it if long commands are
  # decoded as shorter in-grammar phrases. Unset = 0 (off).
  token_bonus: "float?"
  debug_logging: bool
homeassistant: 2026.3.0
