[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name        = "speech_to_phrase"
version     = "2.0.0"
license     = {text = "Apache-2.0"}
description = "Constrained CTC speech-to-text over sentence templates (Citrinet/Coqui + OpenFST)"
authors     = [
    {name = "The Home Assistant Authors", email = "hello@home-assistant.io"}
]
# The native _fst extension is built against the CPython limited API for 3.12
# (abi3), so 3.12 is the floor.
requires-python = ">=3.12"
# Recognition library only. The add-on's own server dependencies (flask,
# wyoming, hassil, ...) stay in the add-on's requirements.txt.
dependencies = [
    "numpy",
    "onnxruntime",
    "sentencepiece",
    "soundfile",
    "librosa",
    "icu-rbnf",
]

[tool.scikit-build]
# Tag the wheel cp312-abi3: one wheel runs on every CPython >= 3.12. The native
# module is built against the limited API (USE_SABI in CMakeLists.txt).
wheel.py-api = "cp312"
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

wheel.packages = ["speech_to_phrase"]
# Don't ship C++ sources in the wheel.
wheel.exclude = ["**/*.cc"]

[tool.scikit-build.cmake]
version = ">=3.26"
