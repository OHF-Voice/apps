---
version: 0.1.0
slug: voice
name: Voice
description: A second opinion on the wake words your voice satellites hear
url: https://github.com/OHF-Voice/apps/tree/main/voice
arch:
  - amd64
  - aarch64
init: false
# Announced to Home Assistant over the Supervisor's discovery API, which
# starts a config flow in the integration of the same name. There is nothing
# for anyone to fill in: installing the app is the whole setup.
discovery:
  - voice_app
# Home Assistant reaches the app by its container hostname on the Supervisor
# network, so the port is here only to be reachable for debugging, and is not
# published on the host.
ports:
  "10800/tcp": null
ports_description:
  "10800/tcp": Wake word verification (HTTP and websocket)
# Decoding graphs are built once per wake word and cached here, so an update
# to the app does not rebuild them.
options: {}
schema: {}
homeassistant: 2026.12.0
